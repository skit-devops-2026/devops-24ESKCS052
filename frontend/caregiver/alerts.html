<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Alerts — MedRemind+</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/caregiver.js"></script>
    <script src="../js/notifications.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { const u = caregiverInit(); if (!u) return; const p = patientForCaregiver(u.id); function render() { if (!p) { alerts.innerHTML = "<div class='card'><p class='muted'>No patient connected.</p></div>"; return; } const missed = getLogsForPatient(p.id).filter(l => l.status === "missed").slice().reverse(); alerts.innerHTML = missed.length ? missed.map(l => { const m = Store.get("medicines", []).find(x => x.id === l.medicineId); return `<div class="alert"><strong>Missed dose</strong><p>${p.name} missed ${m?.name || "medicine"} scheduled for ${formatTime(l.scheduledTime)} on ${formatDate(l.date)}.</p><button class="btn btn-small" onclick="caregiverSendReminder('${p.id}')">Send Reminder</button></div>` }).join("") : "<div class='card'><p class='muted'>No missed-dose alerts.</p></div>"; } render(); });
    </script>
</head>

<body>
    <header class="topbar">
        <div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand"
                href="../caregiver/dashboard.html">MedRemind<span>+</span></a></div>
        <div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small"
                onclick="logout()">Logout</button></div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="nav-title">Caregiver</div>
            <nav class="nav">
                <a href="../caregiver/dashboard.html">Dashboard</a>
                <a href="../caregiver/patients.html">Patients</a>
                <a href="../caregiver/alerts.html">Alerts</a>
                <a href="../caregiver/notifications.html">Notifications</a>
                <a href="../caregiver/reports.html">Reports</a>
                <a href="../caregiver/profile.html">Profile</a>
            </nav>
        </aside>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1>Alerts</h1>
                    <div class="muted">Missed-dose events that may need attention.</div>
                </div>
            </div>
            <div id="alerts"></div>
        </main>
    </div>
    <script>document.addEventListener("DOMContentLoaded", () => { const u = currentUser(); document.querySelectorAll("[data-user-name]").forEach(e => e.textContent = u?.name || ""); });</script>
</body>

</html>
