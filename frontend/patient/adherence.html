<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adherence — MedRemind+</title><link rel="stylesheet" href="../css/style.css"><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/patient.js"></script><script src="../js/reminders.js"></script><script src="../js/notifications.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const u=patientInit();if(!u)return;const logs=getLogsForPatient(u.id).filter(l=>l.status!=="pending");document.getElementById("overall").textContent=adherenceFor(u.id)+"%";document.getElementById("taken").textContent=logs.filter(l=>l.status==="taken").length;document.getElementById("missed").textContent=logs.filter(l=>l.status==="missed").length;document.getElementById("snoozed").textContent=logs.filter(l=>l.status==="snoozed").length;
 let html="";for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const day=logs.filter(l=>l.date===ds);const pct=day.length?Math.round(day.filter(l=>l.status==="taken").length/day.length*100):0;html+=`<div style="margin:14px 0"><div class="progress-row"><span>${formatDate(ds)}</span><strong>${pct}%</strong></div><div class="progress"><div style="width:${pct}%"></div></div></div>`;}document.getElementById("days").innerHTML=html;
});
</script>
</head><body>
<header class="topbar"><div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand" href="../patient/dashboard.html">MedRemind<span>+</span></a></div><div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside class="sidebar">
    <div class="nav-title">Patient</div>
    <nav class="nav">
      <a href="../patient/dashboard.html">Dashboard</a>
      <a href="../patient/medicines.html">My Medicines</a>
      <a href="../patient/history.html">Medication History</a>
      <a href="../patient/adherence.html">Adherence</a>
      <a href="../patient/notifications.html">Notifications</a>
      <a href="../patient/profile.html">Profile & Settings</a>
    </nav></aside><main class="main">
<div class="page-head"><div><h1>Adherence</h1><div class="muted">Simple statistics from your medication logs.</div></div></div>
<div class="grid grid-4"><div class="card"><div class="muted">Overall</div><div class="stat" id="overall">0%</div></div><div class="card"><div class="muted">Taken</div><div class="stat" id="taken">0</div></div><div class="card"><div class="muted">Missed</div><div class="stat" id="missed">0</div></div><div class="card"><div class="muted">Snoozed</div><div class="stat" id="snoozed">0</div></div></div>
<div class="card" style="margin-top:16px"><h3>Recent days</h3><div id="days"></div></div>
</main></div>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=currentUser();document.querySelectorAll("[data-user-name]").forEach(e=>e.textContent=u?.name||"");});</script>
</body></html>
