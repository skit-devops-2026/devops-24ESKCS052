<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile & Settings — MedRemind+</title><link rel="stylesheet" href="../css/style.css"><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/patient.js"></script><script src="../js/reminders.js"></script><script src="../js/notifications.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{const u=patientInit();if(!u)return;const users=Store.get("users",[]);const full=users.find(x=>x.id===u.id);const settings=Store.get("settings",{})[u.id]||{reminders:true,snooze:10,caregiverAlerts:true};pname.value=full.name;pemail.value=full.email;phone.value=full.phone||"";reminders.value=String(settings.reminders);snooze.value=settings.snooze;caregiverAlerts.value=String(settings.caregiverAlerts);
saveProfile.onclick=()=>{full.name=pname.value.trim()||full.name;Store.set("users",users);Store.set("currentUser",{...u,name:full.name});toast("Profile saved.");};
saveSettings.onclick=()=>{const all=Store.get("settings",{});all[u.id]={reminders:reminders.value==="true",snooze:Number(snooze.value)||10,caregiverAlerts:caregiverAlerts.value==="true",dailySummary:true};Store.set("settings",all);toast("Settings saved.");};
});
</script>
</head><body>
<header class="topbar"><div class="btn-row"><button class="icon-btn mobile-menu">☰</button><a class="brand" href="../patient/dashboard.html">MedRemind<span>+</span></a></div><div class="top-actions"><span class="muted" data-user-name></span><button class="btn btn-small" onclick="logout()">Logout</button></div></header>
<div class="layout"><aside class="sidebar">
    <div class="nav-title">Patient</div>
    <nav class="nav">
      <a href="../patient/dashboard.html">Dashboard</a>
      <a href="../patient/medicines.html">My Medicines</a>
      <a href="../patient/history.html">Medication History</a>
      <a href="../patient/adherence.html">Adherence</a>
      <a href="../patient/notifications.html">Notifications</a>
      <a href="../patient/profile.html">Profile & Settings</a>
    </nav></aside><main class="main">
<div class="page-head"><div><h1>Profile & Settings</h1><div class="muted">Basic account and reminder preferences.</div></div></div>
<div class="grid grid-2"><div class="card"><h3>Profile</h3><div class="form-grid"><div class="field"><label>Name</label><input id="pname"></div><div class="field"><label>Email</label><input id="pemail" disabled></div><div class="field"><label>Phone</label><input id="phone" placeholder="Optional"></div></div><button class="btn btn-primary" id="saveProfile" style="margin-top:15px">Save Profile</button></div>
<div class="card"><h3>Reminder Settings</h3><div class="field"><label>Reminders enabled</label><select id="reminders"><option value="true">On</option><option value="false">Off</option></select></div><div class="field" style="margin-top:12px"><label>Snooze duration (minutes)</label><input id="snooze" type="number" min="1"></div><div class="field" style="margin-top:12px"><label>Caregiver alerts</label><select id="caregiverAlerts"><option value="true">On</option><option value="false">Off</option></select></div><button class="btn btn-primary" id="saveSettings" style="margin-top:15px">Save Settings</button></div></div>
<div class="card" style="margin-top:16px"><h3>Prototype tools</h3><p class="muted">Reset demo data if you want to start the presentation flow again.</p><button class="btn" onclick="resetDemo()">Reset Demo Data</button></div>
</main></div>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=currentUser();document.querySelectorAll("[data-user-name]").forEach(e=>e.textContent=u?.name||"");});</script>
</body></html>
